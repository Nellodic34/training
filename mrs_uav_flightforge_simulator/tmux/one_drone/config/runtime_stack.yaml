launcher:
  auto_start_node: triangulation  # one of: none, detection, triangulation
  open_error_plot: true
  plot_delay_sec: 10

simulation:
  drone_count: 3  # allowed values: 1, 2, 3

uav_roles:
  observer1: uav1   # first observer UAV (camera source)
  observer2: uav2   # second observer UAV (camera source)
  target: uav3      # target UAV (ground truth source)

ekf:
  # EKF tuning values passed to the multi-view triangulation node.
  kf_process_noise_pos: 0.5   # Process noise applied to the position states in the prediction model.
  kf_process_noise_vel: 1.0   # Process noise applied to the velocity states in the prediction model.
  kf_measurement_noise: 0.05  # Measurement noise covariance; lower values trust triangulated points more.
  kf_initial_covariance: 10.0 # Initial covariance assigned when the filter state is created.
