launcher:
  auto_start_node: triangulation  # one of: none, detection, triangulation
  open_error_plot: false
  plot_delay_sec: 10

simulation:
  drone_count: 3  # allowed values: 1, 2, 3

uav_roles:
  observer1: uav1   # first observer UAV (camera source)
  observer2: uav2   # second observer UAV (camera source)
  target: uav3      # target UAV (ground truth source)

ekf:
  # EKF tuning values passed to the multi-view triangulation node.
  kf_process_noise_acc: 1.2    # White-jerk std (CA model). Lower = drone makes smooth curves
  kf_process_noise_vel: 2.0    # White-accel std (CV model process noise). Higher = drone can accelerate a lot
  imm_transition_prob: 0.90    # Probability of staying in the same dynamic model
  kf_measurement_noise: 0.05   # Base measurement noise R (used when rays are orthogonal)
  kf_adaptive_cov_max_multiplier: 50.0 # Max multiplier for depth variance when rays are nearly parallel
  kf_initial_covariance: 1.0   # Initial covariance assigned when the filter state is created.



