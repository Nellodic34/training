uav_names: [
  "uav1",
  "uav2",
  "uav3",
]

frames:
  fcu:
    publish_tf: false

uav1:

  frame: "x500"
  type: "x500"
  spawn:
    x: 0.0
    y: 15.0
    z: 0.0
    heading: 0.0

uav2:

  frame: "x500"
  type: "x500"
  spawn:
    x: 0.0
    y: 20.0
    z: 0.0
    heading: 0.0

uav3:

  frame: "x500"
  type: "x500"
  spawn:
    x: 3.0
    y: 17.5
    z: 0.0
    heading: 0.0

mrs_uav_flightforge_simulator:

  sensors:

    lidar:

      enabled: false
      horizontal_rays: 128 # [-]
      vertical_rays: 64 # [-]

      lidar_segmented:
        enabled: false
        rate: 10.0 # [Hz]

      lidar_intensity:
        enabled: false
        rate: 10.0 # [Hz]

    rgb:

      enabled: true
      rate: 30.0 # [Hz] era 30
      width: 1280 # [px]
      height: 720 # [px]
      fov: 90.32 # [deg]

      enable_hdr: false
      enable_temporal_aa: false
      enable_raytracing: false

      # offset:
      #   x: 0.118 # [m]
      #   y: 0.0 # [m]
      #   z: 0.016 # [m]

      # rotation:
      #   pitch: 0.0 # [deg]
      #   yaw: 0.0 # [deg]
      #   roll: 0.0 # [deg]

      enable_motion_blur: false

      rgb_segmented:
        enabled: false
        rate: 10.0 # [Hz]
  

      depth:
        enabled: false 
        rate: 1.0 # [Hz]  

    stereo:
      enabled: false
      rate: 30.0

  graphics_settings: "high" # "low", "medium", "high", "epic", "cinematic"

  realtime_factor: 1.0 # [-]

  # world_name: "valley" # works in Lite
  # world_name: "warehouse" # works in Lite

  # TODO
  # world_name: "cave" # does not work
  # world_name: "dead_spruce_forest" # does not work
  # world_name: "infinite_forest" # does not work
  world_name: "temesvar" 

  # weather_type: "cloudy"

  daytime:

    hour: 15
    minute: 30
